/* ===== Detailed explanations (HTML) ===== */
const EXP4=[
`<h3>1. The place value chart</h3><p>Our number system is based on 10. Each place is worth <b>10 times</b> the place on its right. Digits are grouped in periods of three, separated by commas: the <b>ones period</b> (ones, tens, hundreds), the <b>thousands period</b> and the <b>millions period</b>.</p>
<div class="ex"><b>Example: 4,372,150</b><ul><li>4 → millions = 4,000,000</li><li>3 → hundred thousands = 300,000</li><li>7 → ten thousands = 70,000</li><li>2 → thousands = 2,000</li><li>1 → hundreds = 100</li><li>5 → tens = 50</li><li>0 → ones = 0 (the zero is a place holder)</li></ul></div>
<h3>2. Three ways to write a number</h3><ul><li><b>Standard form:</b> 4,372,150</li><li><b>Word form:</b> four million, three hundred seventy-two thousand, one hundred fifty</li><li><b>Expanded form:</b> 4,000,000 + 300,000 + 70,000 + 2,000 + 100 + 50</li></ul><p>To read a number, read each period from the left and say the period name (million, thousand), but never say the name "ones".</p>
<h3>3. Digit versus value</h3><p>The <b>digit</b> is the symbol; the <b>value</b> is digit × place. In 4,372,150 the digit 7 is worth 70,000 because it sits in the ten-thousands place. In 7,000 the same digit is worth ten times less than 70,000.</p>
<h3>4. Comparing and ordering</h3><ol><li>Line the numbers up by place.</li><li>Start from the greatest place and move right.</li><li>The first place where the digits differ decides.</li></ol><div class="ex">Compare 58,430 and 58,340. Ten thousands: 5 = 5. Thousands: 8 = 8. Hundreds: 4 &gt; 3. So <b>58,430 &gt; 58,340</b>.</div><p>To order numbers, compare them two at a time, then write them from least to greatest (or the opposite).</p>
<h3>5. Common mistakes</h3><ul><li>Forgetting the zero place holder: 604,050 is not 64,050.</li><li>Choosing the number with more non-zero digits as the greater one. A number with more digits is greater (if no leading zero).</li><li>Saying "and" inside the number when reading whole numbers.</li></ul>`,
`<h3>1. Adding with the standard algorithm</h3><p>Write the numbers one under the other with the places lined up. Add from the <b>ones</b> to the left. When a place reaches 10 or more, write the ones digit and <b>regroup</b> (carry) 1 to the next place.</p>
<div class="ex"><b>48,675 + 27,358</b><ul><li>Ones: 5 + 8 = 13 → write 3, carry 1</li><li>Tens: 7 + 5 + 1 = 13 → write 3, carry 1</li><li>Hundreds: 6 + 3 + 1 = 10 → write 0, carry 1</li><li>Thousands: 8 + 7 + 1 = 16 → write 6, carry 1</li><li>Ten thousands: 4 + 2 + 1 = 7</li></ul>Answer: <b>76,033</b></div>
<h3>2. Subtracting with regrouping</h3><p>Subtract from the ones. If the top digit is smaller, regroup 1 from the next place (it becomes 10 in this place).</p>
<div class="ex"><b>50,000 − 23,478</b>: there are zeros, so regroup is long. Trick: subtract 1 from the top (49,999), subtract normally (49,999 − 23,478 = 26,521), then add the 1 back: <b>26,522</b>.</div><p><b>Check:</b> addition and subtraction are inverse operations. 23,478 + 26,522 = 50,000 ✓.</p>
<h3>3. Estimating to check</h3><p>Round each number, then compute. 48,675 + 27,358 → 49,000 + 27,000 = 76,000, which is close to 76,033, so the answer is reasonable.</p>
<h3>4. Mental strategies</h3><ul><li><b>Compensation:</b> 598 + 247 = 600 + 247 − 2 = 845.</li><li><b>Breaking apart:</b> 345 + 128 = 345 + 100 + 28 = 473.</li><li><b>Making tens/hundreds:</b> 96 + 38 = 100 + 34 = 134.</li></ul>
<h3>5. Word problems with bar models</h3><p>A bar model shows parts and the whole. Use a letter (a variable) for the unknown.</p><div class="ex">A shop has 1,250 notebooks. It sells 480 on Sunday and 365 on Monday. How many are left?<br>Step 1: 480 + 365 = 845 sold.<br>Step 2: 1,250 − 845 = <b>405</b> left (n = 405).</div><p>Read the problem, find what is asked, plan the steps, solve, then check that the answer makes sense.</p>`,
`<h3>1. Units of length</h3><p>1 km = 1,000 m &nbsp;|&nbsp; 1 m = 100 cm &nbsp;|&nbsp; 1 cm = 10 mm. Use a ruler or a tape measure.</p>
<h3>2. Mass and capacity</h3><p>Mass (how heavy): 1 kg = 1,000 g, measured with a scale. Capacity (how much a container holds): 1 L = 1,000 mL, measured with a measuring cup.</p>
<h3>3. Converting units</h3><ul><li>Big unit → small unit: <b>multiply</b>.</li><li>Small unit → big unit: <b>divide</b>.</li></ul><div class="ex">5 km = 5 × 1,000 = 5,000 m<br>2,500 g = 2 kg 500 g<br>3 L 250 mL = 3 × 1,000 + 250 = 3,250 mL<br>4 hours = 4 × 60 = 240 minutes</div>
<h3>4. Units of time</h3><p>1 hour = 60 minutes, 1 minute = 60 seconds, 1 day = 24 hours, 1 week = 7 days. Remember A.M. (midnight to noon) and P.M. (noon to midnight).</p>
<h3>5. Elapsed time</h3><p>Elapsed time is how much time passes between a start and an end. Jump to the next full hour, then add whole hours, then the remaining minutes.</p><div class="ex">8:45 to 11:20<br>8:45 → 9:00 = 15 min<br>9:00 → 11:00 = 2 h<br>11:00 → 11:20 = 20 min<br>Total = <b>2 h 35 min</b></div>
<h3>6. Word problems with measurement</h3><div class="ex"><b>Add:</b> 2 m 60 cm + 1 m 70 cm = 3 m 130 cm = <b>4 m 30 cm</b>.<br><b>Multiply:</b> 8 bottles × 250 mL = 2,000 mL = <b>2 L</b>.<br><b>Divide:</b> 3 kg of rice shared equally in 6 bags: 3,000 g ÷ 6 = <b>500 g</b> per bag.</div><p>Tip: always convert to the same unit before adding or subtracting.</p>`,
`<h3>1. Perimeter</h3><p>The perimeter is the distance <b>around</b> a shape. It is measured in length units (cm, m).</p><ul><li>Any polygon: add all the sides.</li><li>Square: P = 4 × side.</li><li>Rectangle: P = 2 × (length + width).</li></ul><div class="ex">Rectangle 12 cm × 7 cm: P = 2 × (12 + 7) = <b>38 cm</b>.<br>Square with side 9 m: P = 4 × 9 = <b>36 m</b>.</div>
<h3>2. Area</h3><p>Area is the number of unit squares that cover a surface. It is measured in <b>square units</b> (cm², m²).</p><ul><li>Rectangle: A = length × width.</li><li>Square: A = side × side.</li></ul><div class="ex">Rectangle 9 cm × 6 cm: A = 9 × 6 = <b>54 cm²</b>.</div>
<h3>3. Finding a missing side</h3><div class="ex"><b>From perimeter:</b> a rectangle has P = 30 cm and length 9 cm. Half the perimeter = 15 = length + width, so width = 15 − 9 = <b>6 cm</b>.<br><b>From area:</b> A = 72 m² and width 8 m. Length = 72 ÷ 8 = <b>9 m</b>.</div>
<h3>4. Composite (L-shaped) figures</h3><p>Split the shape into rectangles, find each area, then add. Example: a 10 × 4 rectangle plus a 3 × 5 rectangle: 40 + 15 = <b>55 square units</b>. For perimeter, add the outside sides only.</p>
<h3>5. Same perimeter, different area</h3><p>A 8 × 2 rectangle and a 5 × 5 square both have perimeter 20, but their areas are 16 and 25. The more "square" the shape is, the larger the area.</p>
<h3>6. Common mistakes</h3><ul><li>Writing cm instead of cm² for area.</li><li>Adding only two sides of a rectangle for the perimeter.</li><li>Mixing units: convert first (cm and m).</li></ul>`,
`<h3>1. Two kinds of comparison</h3><p>"6 <b>more</b> than" is <b>additive</b> (use + or −). "6 <b>times as many</b> as" is <b>multiplicative</b> (use × or ÷).</p><div class="ex">3 and 12: 12 is 9 more than 3 (additive), and 12 is 4 times as many as 3 (multiplicative).</div>
<h3>2. Multiplication comparison statements</h3><p>"A is 5 times as many as B" means <b>A = 5 × B</b>. B is the small amount (one bar), A is five equal bars.</p><div class="ex">A red ribbon is 8 m. The blue ribbon is 5 times as long: 5 × 8 = <b>40 m</b>.</div>
<h3>3. Finding the smaller amount</h3><p>Use division, the inverse operation. Write an equation with a variable.</p><div class="ex">A green ribbon is 36 m, which is 4 times as long as the yellow ribbon. 4 × n = 36, so n = 36 ÷ 4 = <b>9 m</b>.</div>
<h3>4. Properties of multiplication</h3><ul><li><b>Commutative:</b> 7 × 4 = 4 × 7.</li><li><b>Associative:</b> (2 × 3) × 4 = 2 × (3 × 4) = 24.</li><li><b>Distributive:</b> 6 × 7 = 6 × (5 + 2) = 30 + 12 = 42.</li><li><b>Identity:</b> n × 1 = n.</li><li><b>Zero:</b> n × 0 = 0.</li></ul>
<h3>5. Patterns</h3><p>Multiples of 5 end in 0 or 5. Multiples of 10 end in 0. When you multiply by 10, each digit moves one place to the left.</p>
<h3>6. Solving a word problem</h3><div class="ex">Ahmed has 9 marbles. Ali has 4 times as many. How many does Ali have?<br>Draw 1 bar for Ahmed (9) and 4 equal bars for Ali. 4 × 9 = <b>36</b>.</div>`,
`<h3>1. Factors</h3><p>A factor of a number divides it with <b>no remainder</b>. Find factors in pairs whose product is the number.</p><div class="ex"><b>Factors of 36:</b> 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6 → 1, 2, 3, 4, 6, 9, 12, 18, 36.</div><p>Every number has 1 and itself as factors.</p>
<h3>2. Divisibility rules</h3><ul><li>By 2: last digit is even.</li><li>By 5: last digit is 0 or 5.</li><li>By 10: last digit is 0.</li><li>By 3: the digit sum is divisible by 3.</li><li>By 9: the digit sum is divisible by 9.</li></ul><div class="ex">4,725: digit sum 4 + 7 + 2 + 5 = 18, so it is divisible by 3 and 9; it ends in 5, so by 5 too. Check: 4,725 ÷ 9 = 525.</div>
<h3>3. Multiples</h3><p>Multiples are the products of a number and 1, 2, 3, … The multiples of 7: 7, 14, 21, 28, 35, … They go on forever.</p>
<h3>4. Common factors and common multiples</h3><div class="ex">Multiples of 4: 4, 8, 12, 16, 20, 24<br>Multiples of 6: 6, 12, 18, 24<br>Common multiples: 12, 24 (the least is <b>12</b>).<br>Factors of 12: 1, 2, 3, 4, 6, 12; factors of 18: 1, 2, 3, 6, 9, 18. Common factors: 1, 2, 3, 6 (the greatest is <b>6</b>).</div>
<h3>5. Prime and composite numbers</h3><ul><li><b>Prime:</b> exactly 2 factors (1 and itself): 2, 3, 5, 7, 11, 13.</li><li><b>Composite:</b> more than 2 factors: 4, 9, 12, 51.</li><li>The number 1 is neither prime nor composite.</li><li>2 is the only even prime.</li></ul><div class="ex">Is 51 prime? Digit sum = 6, so 3 divides it: 51 = 3 × 17. It is composite.</div>`,
`<h3>1. Multiplying by a 1-digit number</h3><p>Break the number into places (partial products) and add.</p><div class="ex">407 × 6: 400 × 6 = 2,400 and 7 × 6 = 42. Total = <b>2,442</b>.</div>
<h3>2. Multiplying 2-digit × 2-digit</h3><div class="ex"><b>36 × 24</b><br><u>Partial products:</u> 36 × 4 = 144; 36 × 20 = 720; 144 + 720 = <b>864</b>.<br><u>Area model:</u> (30 + 6) × (20 + 4) = 600 + 120 + 120 + 24 = <b>864</b>.</div><p>Estimate first: 36 × 24 ≈ 40 × 20 = 800. Close to 864 ✓. Remember the zero placeholder when multiplying by the tens digit.</p>
<h3>3. Dividing by a 1-digit number</h3><p>Divide, multiply, subtract, bring down — repeat.</p><div class="ex"><b>3,456 ÷ 4</b><br>34 ÷ 4 = 8 (8 × 4 = 32, remainder 2)<br>Bring down 5: 25 ÷ 4 = 6 (24, remainder 1)<br>Bring down 6: 16 ÷ 4 = 4<br>Answer: <b>864</b>. Check: 864 × 4 = 3,456 ✓.</div>
<h3>4. Division with a remainder</h3><div class="ex"><b>859 ÷ 6:</b> 8 ÷ 6 = 1 r 2; 25 ÷ 6 = 4 r 1; 19 ÷ 6 = 3 r 1. Answer: <b>143 remainder 1</b>. Check: 143 × 6 + 1 = 859 ✓.</div><p>The remainder is always smaller than the divisor.</p>
<h3>5. What to do with the remainder</h3><div class="ex">43 chairs, 5 chairs per row. 43 ÷ 5 = 8 r 3. We need <b>9 rows</b> (round up so everyone has a seat). But if the question asks "how many full rows?" the answer is 8.</div>
<h3>6. Multiplication and division are inverses</h3><p>If 12 × 7 = 84, then 84 ÷ 7 = 12 and 84 ÷ 12 = 7. Use this to check your work.</p>`,
`<h3>1. Why we need rules</h3><p>Without agreed rules, 5 + 3 × 4 could be 32 or 17. Mathematicians agreed on one order so everyone gets the same answer.</p>
<h3>2. The order</h3><ol><li><b>Parentheses</b> first.</li><li><b>Multiplication and division</b>, from left to right.</li><li><b>Addition and subtraction</b>, from left to right.</li></ol>
<h3>3. Worked examples</h3><div class="ex">5 + 3 × 4 → 5 + 12 = <b>17</b><br>(5 + 3) × 4 → 8 × 4 = <b>32</b><br>48 ÷ 6 × 2 → 8 × 2 = <b>16</b> (left to right, not 48 ÷ 12)<br>30 − 12 + 5 → 18 + 5 = <b>23</b><br>7 + (12 − 4) × 3 → 7 + 8 × 3 → 7 + 24 = <b>31</b></div>
<h3>4. Writing expressions from words</h3><div class="ex">"Add 6 and 4, then multiply by 3" → (6 + 4) × 3 = <b>30</b>.<br>"Multiply 6 by 3, then add 4" → 6 × 3 + 4 = <b>22</b>.</div>
<h3>5. Parentheses change the answer</h3><p>2 + 3 × 4 = 14 but (2 + 3) × 4 = 20. Always look for parentheses first.</p>
<h3>6. Common mistakes</h3><ul><li>Always working strictly left to right.</li><li>Adding before multiplying.</li><li>Doing division after multiplication when division comes first on the left.</li></ul>`
];

/* ========= AI TUTOR (مساعد ذكي) ========= */
/* --- Gemini API ---
 ضع مفتاحك من Google AI Studio هنا. تحذير: أي مفتاح داخل التطبيق يمكن استخراجه، لذلك قيّده (Application restrictions + حد يومي) أو استخدم CHAT_ENDPOINT كوسيط آمن. */
const GEMINI_API_KEY="";
const GEMINI_MODEL="gemini-3.5-flash"; // غيّره إذا لم يكن متاحاً لحسابك (مثل gemini-2.5-flash)
async function geminiAsk(raw,ctx){
 const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+GEMINI_MODEL+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":GEMINI_API_KEY},
  body:JSON.stringify({systemInstruction:{parts:[{text:INSTR+"\n\nسياق الطالب: "+ctx}]},contents:raw.map(x=>({role:x.role=="user"?"user":"model",parts:[{text:x.content}]})),generationConfig:{maxOutputTokens:1500,temperature:0.6}})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw{code:r.status==429?"rate_limited":"gemini_"+r.status};
 const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||"").join("");
 if(!t)throw{code:"empty"};
 return t;
}
const CHAT_ENDPOINT=""; // اختياري للتطبيق المستقل: رابط خادمك الذي يستدعي Claude (لا تضع مفتاح API داخل التطبيق)
let CH=[],chBusy=false;
const INSTR="أنت «مساعد مدرستي»: مساعد تعليمي ودود لطلاب المنهج المصري (ابتدائي/إعدادي/ثانوي). أجب بنفس لغة الطالب (عربية مبسطة، أو إنجليزية إذا كتب بها). اشرح خطوة بخطوة بأسلوب يناسب عمر الطالب مع مثال قصير، وشجّعه، ولا تكتفِ بالحل النهائي بل وضّح الطريقة. التزم بالموضوعات الدراسية، وإن سأل عن شيء خارجها فأجب باختصار ثم أعده للدراسة. لا تطلب أي بيانات شخصية. اجعل الرد أقل من 150 كلمة، نصاً عادياً بدون رموز تنسيق مثل ** أو #.";
function chatCtx(){
 let c=STG().ar+(S.grade?" - "+gl():"")+(S.term?" - الفصل "+(S.term==1?"الأول":"الثاني"):"")+".";
 try{if(S.screen>=6&&S.subject){const s=subj();c+=" المادة: "+sn(s).a+".";if(S.screen==7){const u=unitsOf(s)[S.unit];if(u)c+=" الوحدة: "+u.t+". ملخص: "+u.summary.join("؛ ")+"."}}}catch(e){}
 return c;
}
function chatUi(){const f=document.getElementById("fab");if(f)f.hidden=!(S.user&&S.screen!=1)}
function chatOpen(o){
 document.getElementById("chat").hidden=!o;
 if(o){if(!CH.length)CH.push({role:"assistant",content:"أهلاً "+(S.user?S.user.name:"")+"! أنا مساعدك الذكي 🤖 اسألني عن أي درس، أو اضغط على أحد الأزرار بالأسفل."});chatDraw();setTimeout(()=>document.getElementById("cin").focus(),60)}
}
function chatDraw(){
 const m=document.getElementById("cmsg");m.textContent="";
 CH.forEach(x=>{const d=document.createElement("div");d.className="bub "+(x.role=="user"?"me":"bot");d.textContent=x.content;m.appendChild(d)});
 m.scrollTop=m.scrollHeight;
}
async function chatSend(t){
 t=(t||"").trim();if(!t||chBusy)return;
 document.getElementById("cin").value="";
 CH.push({role:"user",content:t});
 const bot={role:"assistant",content:"جارٍ التفكير…"};CH.push(bot);chatDraw();chBusy=true;
 let hist=CH.slice(0,-1).slice(-9);while(hist.length&&hist[0].role!="user")hist.shift();
 const ctx=chatCtx(),msgs=hist.map(x=>({role:x.role,content:x.content}));
 const raw=msgs.map(x=>({role:x.role,content:x.content}));
 msgs[msgs.length-1].content=INSTR+"\n\nسياق الطالب: "+ctx+"\n\nرسالة الطالب:\n"+t;
 try{
  let smp=null;try{smp=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){}
  if(GEMINI_API_KEY){bot.content=await geminiAsk(raw,ctx)}
  else if(smp){const r=await smp(msgs,{modelTier:"quick",cache:false,onText:({text})=>{bot.content=text;chatDraw()}});bot.content=r.text||bot.content}
  else if(CHAT_ENDPOINT){const r=await fetch(CHAT_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs,context:ctx})});const j=await r.json();bot.content=j.text||"لم أستطع الرد الآن."}
  else bot.content="المساعد غير مفعّل: ضع GEMINI_API_KEY (أو CHAT_ENDPOINT) في الكود.";
 }catch(e){bot.content=e&&String(e.code).startsWith("gemini_")?"تعذر الاتصال بـ Gemini (رمز "+e.code.slice(7)+"). تأكد من المفتاح واسم النموذج.":e&&e.code=="empty"?"لم يصل رد من Gemini، حاول مرة أخرى.":e&&e.code=="not_granted"?"لم تسمح باستخدام المساعد. أعد المحاولة ووافق عند الطلب.":e&&e.code=="rate_limited"?"المساعد مشغول، حاول بعد لحظات.":"حدث خطأ، حاول مرة أخرى."}
 chBusy=false;chatDraw();
}
document.addEventListener("keydown",e=>{if(e.key=="Escape")chatOpen(false)});
fbInit();render();
